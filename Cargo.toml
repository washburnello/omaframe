[package]
name = "omaframe"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "omaframe"
path = "src/main.rs"

[[bin]]
name = "omaframe-export"
path = "src/bin/omaframe.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
